appId: com.asidefm.app.dev
---
- launchApp:
    stopApp: false
- tapOn:
    id: tab-upload
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: choose-audio
    waitToSettleTimeoutMs: 1000
- tapOn:
    text: Show roots
    waitToSettleTimeoutMs: 1000
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: Open from
    timeout: 5000
- waitForAnimationToEnd
- tapOn:
    text: Downloads
    waitToSettleTimeoutMs: 1000
    retryTapIfNoChange: false
- waitForAnimationToEnd
- tapOn:
    text: Aside-upload.wav
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: transcript
    timeout: 90000
- assertVisible: Aside-upload.wav
- takeScreenshot: uploaded-episode
