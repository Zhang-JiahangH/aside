appId: com.asidefm.app.dev
---
- launchApp:
    stopApp: false
- tapOn:
    id: tab-upload
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: choose-audio
    waitToSettleTimeoutMs: 1000
- tapOn: Show roots
- waitForAnimationToEnd
- tapOn: Downloads
- waitForAnimationToEnd
- tapOn:
    text: Aside-upload.wav
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: transcript
    timeout: 90000
- assertVisible: Aside-upload.wav
- takeScreenshot: uploaded-episode
