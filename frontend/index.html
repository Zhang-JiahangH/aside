<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/aside-mark.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aside" />
    <meta property="og:image" content="https://asidefm.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Aside — a podcast player you can talk back to"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://asidefm.com/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Aside — a podcast player you can talk back to"
    />
    <meta
      name="theme-color"
      content="#f7f6f3"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#191a1d"
      media="(prefers-color-scheme: dark)"
    />

    <!--
      Everything between the two seo:head markers describes one route: title,
      description, canonical, robots, hreflang, social titles and JSON-LD. The
      Worker replaces the whole block per request; the values below are the
      defaults a static host would serve.
    -->
    <!--aside:seo:head:start-->
    <title>Aside · Interrupt a podcast, ask out loud, keep listening</title>
    <meta
      name="description"
      content="Aside is a podcast player you can talk back to: interrupt an episode to ask by voice, keep the conversation going, and resume from a complete sentence."
    />
    <link rel="canonical" href="https://asidefm.com/" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link rel="alternate" hreflang="en" href="https://asidefm.com/" />
    <link rel="alternate" hreflang="zh" href="https://asidefm.com/zh" />
    <link rel="alternate" hreflang="x-default" href="https://asidefm.com/" />
    <meta
      property="og:title"
      content="Aside · Interrupt a podcast, ask out loud, keep listening"
    />
    <meta
      property="og:description"
      content="Aside is a podcast player you can talk back to: interrupt an episode to ask by voice, keep the conversation going, and resume from a complete sentence."
    />
    <meta property="og:url" content="https://asidefm.com/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta
      name="twitter:title"
      content="Aside · Interrupt a podcast, ask out loud, keep listening"
    />
    <meta
      name="twitter:description"
      content="Aside is a podcast player you can talk back to: interrupt an episode to ask by voice, keep the conversation going, and resume from a complete sentence."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://asidefm.com/#website",
            "url": "https://asidefm.com/",
            "name": "Aside",
            "description": "A podcast player you can talk back to: interrupt an episode to ask by voice, keep the conversation going, and resume from a complete sentence.",
            "inLanguage": ["en", "zh-CN"]
          },
          {
            "@type": "WebApplication",
            "@id": "https://asidefm.com/#webapp",
            "name": "Aside",
            "url": "https://asidefm.com/",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Web",
            "browserRequirements": "Requires a browser with Web Audio, MediaRecorder and WebRTC support.",
            "description": "A podcast player you can talk back to: interrupt an episode to ask by voice, keep the conversation going, and resume from a complete sentence.",
            "inLanguage": ["en", "zh-CN"]
          }
        ]
      }
    </script>
    <!--aside:seo:head:end-->
  </head>
  <body>
    <div id="root">
      <!--
        Crawler-visible first paint. The Worker replaces this block with the
        route's own text and links; the values below are the static defaults.
      -->
      <!--aside:seo:body:start-->
      <main>
        <h1>Aside · 可以插话的播客播放器</h1>
        <p>
          听到好奇的地方开口提问，Aside 结合前面听过的内容回答；聊完从完整的一句话接着听。
        </p>
        <p>
          Aside is a podcast player you can talk back to: interrupt an episode to
          ask by voice, keep the conversation going, and resume from a complete
          sentence.
        </p>
      </main>
      <!--aside:seo:body:end-->
    </div>
    <noscript>
      <p>
        启用 JavaScript 即可播放示例并开始对话。Enable JavaScript to play the
        samples and start a conversation.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
